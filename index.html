<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Recetario</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- PWA Dynamic Injection Script -->
    <script>
        const manifestData = {
            "name": "Mi Recetario",
            "short_name": "Recetas",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#fff7ed",
            "theme_color": "#ea580c",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3565/3565418.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3565/3565418.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.write(`<link rel="manifest" href="${manifestUrl}">`);
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class', // Habilita el modo oscuro manual
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #fdba74; border-radius: 20px; }

        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
        
        .sidebar-enter { transform: translateX(100%); }
        .sidebar-enter-active { transform: translateX(0); transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1); }
        
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        @media (min-width: 640px) {
            .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
    
    <meta name="theme-color" content="#EA580C">
</head>

        <i id="toastIcon" class="fa-solid fa-check-circle text-green-400"></i>
        <span id="toastMsg" class="font-medium text-sm">Mensaje</span>

    <script>
        // --- TEMA OSCURO ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const html = document.documentElement;
        const toggleIcon = themeToggleBtn.querySelector('i');

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            toggleIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                toggleIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.setItem('theme', 'light');
                toggleIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // --- INDEXED DB LOGIC ---
        const DB_NAME = 'RecetarioDB';
        const STORE_NAME = 'recipes';
        let db;
        let currentRecipes = [];
        let activeRecipeId = null;
        const PLACEHOLDER_IMG = "https://placehold.co/400x300/ffedd5/ea580c?text=Foto+Receta";

        // Registrar SW
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => { 
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
                });
            `;
            try {
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
            } catch(e){}
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2); // Subida de versión a 2 por cambios de modelo
                request.onerror = (event) => reject(event.target.error);
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        async function loadRecipes() {
            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                
                request.onsuccess = () => {
                    currentRecipes = request.result || [];
                    currentRecipes.sort((a, b) => b.createdAt - a.createdAt); // Más recientes primero
                    
                    document.getElementById('loadingIndicator').classList.add('hidden');
                    
                    if (currentRecipes.length === 0) {
                        injectDefaultRecipe();
                    } else {
                        renderRecipes(currentRecipes);
                    }
                    resolve();
                };
            });
        }

        function injectDefaultRecipe() {
            const defaultRecipe = {
                id: Date.now().toString(),
                title: "Sándwich de Jamón FUD y Queso",
                thumbnail: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                ingredients: "2 rebanadas de pan artesanal (o Bimbo Doble Fibra), 3 rebanadas de Jamón Virginia FUD, 2 rebanadas de queso manchego, 1 cucharada de mayonesa, 1/2 aguacate en rodajas, Espinacas frescas al gusto",
                steps: "1. Tuesta ligeramente las rebanadas de pan.\n2. Unta la mayonesa en ambas caras internas del pan.\n3. Coloca una capa de espinacas y el aguacate rebanado.\n4. Añade las rebanadas de Jamón FUD y el queso manchego.\n5. Calienta en un sartén o sandwichera por 3 minutos hasta que el queso se derrita.\n6. ¡Corta por la mitad y disfruta tu comida en superávit!",
                youtube: "",
                createdAt: Date.now()
            };

            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.add(defaultRecipe);
            transaction.oncomplete = () => loadRecipes();
        }

        window.onload = async () => {
            try {
                await initDB();
                await loadRecipes();
            } catch(e) {
                console.error("Error IndexedDB:", e);
                showToast("Error al cargar la base de datos", "error");
            }
        };

        // --- RENDER & UI LOGIC ---
        function renderRecipes(recipesToRender) {
            const grid = document.getElementById('recipeGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (recipesToRender.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-brand-50 dark:border-gray-700 overflow-hidden cursor-pointer hover:shadow-md transition flex flex-col h-full";
                card.onclick = () => openViewModal(recipe.id);
                
                const imgSrc = recipe.thumbnail || PLACEHOLDER_IMG;
                
                card.innerHTML = `
                    <div class="h-32 sm:h-40 overflow-hidden bg-brand-100 dark:bg-gray-700 relative">
                        <img src="${imgSrc}" onerror="this.src='${PLACEHOLDER_IMG}'" alt="${recipe.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h3 class="font-serif font-bold text-gray-800 dark:text-gray-100 text-lg leading-tight line-clamp-2">${recipe.title}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = currentRecipes.filter(r => r.title.toLowerCase().includes(term) || (r.ingredients && r.ingredients.toLowerCase().includes(term)));
            renderRecipes(filtered);
        });

        // --- VISTA PREVIA DE IMAGEN ---
        const urlInput = document.getElementById('recipeImage');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('imagePreview');

        urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            if (url) {
                previewImg.src = url;
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
                previewImg.src = '';
            }
        });

        previewImg.onerror = () => {
            previewImg.src = PLACEHOLDER_IMG; // Si el enlace está roto, usa el predeterminado
        };

        // --- LISTAS DINÁMICAS (Google Keep Style) ---
        const ingContainer = document.getElementById('ingredientsListContainer');
        const stepsContainer = document.getElementById('stepsListContainer');

        function createIngredientRow(val = '') {
            const wrap = document.createElement('div');
            wrap.className = 'flex items-center gap-2';
            
            const dot = document.createElement('div');
            dot.className = 'w-1.5 h-1.5 rounded-full bg-gray-400 dark:bg-gray-500 shrink-0';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.value = val;
            input.placeholder = 'Nuevo ingrediente...';
            input.className = 'w-full bg-transparent border-b border-gray-200 dark:border-gray-600 py-2 focus:border-brand-500 dark:focus:border-brand-500 outline-none transition-colors text-sm sm:text-base';
            
            input.addEventListener('input', function() {
                // Si escribimos algo y es el último elemento, crea uno nuevo
                if (this.value.trim() !== '' && !wrap.nextElementSibling) {
                    ingContainer.appendChild(createIngredientRow());
                }
            });

            wrap.appendChild(dot);
            wrap.appendChild(input);
            return wrap;
        }

        function createStepRow(val = '') {
            const wrap = document.createElement('div');
            wrap.className = 'flex items-start gap-3 bg-gray-50 dark:bg-gray-700/30 p-3 rounded-xl border border-gray-100 dark:border-gray-700';
            
            const num = document.createElement('span');
            num.className = 'step-num font-bold text-gray-400 dark:text-gray-500 mt-1 shrink-0 w-5 text-right';
            
            const textarea = document.createElement('textarea');
            textarea.value = val;
            textarea.rows = 2;
            textarea.placeholder = 'Describe este paso...';
            textarea.className = 'w-full bg-transparent outline-none resize-none text-sm sm:text-base';
            
            textarea.addEventListener('input', function() {
                if (this.value.trim() !== '' && !wrap.nextElementSibling) {
                    stepsContainer.appendChild(createStepRow());
                    updateStepNumbers();
                }
            });

            wrap.appendChild(num);
            wrap.appendChild(textarea);
            return wrap;
        }

        function updateStepNumbers() {
            const numbers = stepsContainer.querySelectorAll('.step-num');
            numbers.forEach((el, index) => {
                el.textContent = `${index + 1}.`;
            });
        }

        window.openAddModal = () => {
            document.getElementById('recipeForm').reset();
            
            // Limpiar listas y vista previa
            ingContainer.innerHTML = '';
            stepsContainer.innerHTML = '';
            previewContainer.classList.add('hidden');
            previewImg.src = '';
            
            // Inyectar primera fila vacía
            ingContainer.appendChild(createIngredientRow());
            stepsContainer.appendChild(createStepRow());
            updateStepNumbers();

            document.getElementById('addModalOverlay').classList.remove('hidden');
        };

        window.closeAddModal = () => document.getElementById('addModalOverlay').classList.add('hidden');

        window.saveRecipe = (e) => {
            e.preventDefault();

            // Recolectar ingredientes (omitir vacíos)
            const ingInputs = Array.from(ingContainer.querySelectorAll('input'));
            const finalIngredients = ingInputs.map(input => input.value.trim()).filter(val => val !== '').join(', ');

            // Recolectar pasos (omitir vacíos)
            const stepTextareas = Array.from(stepsContainer.querySelectorAll('textarea'));
            const finalSteps = stepTextareas
                .map(t => t.value.trim())
                .filter(val => val !== '')
                .map((val, idx) => `${idx + 1}. ${val}`) // Formatearlo como "1. Texto"
                .join('\n');

            // Validar que al menos haya un ingrediente y un paso
            if (!finalIngredients || !finalSteps) {
                showToast("Agrega al menos 1 ingrediente y 1 paso", "error");
                return;
            }

            const newRecipe = {
                id: Date.now().toString(),
                title: document.getElementById('recipeTitle').value.trim(),
                thumbnail: document.getElementById('recipeImage').value.trim(),
                ingredients: finalIngredients,
                steps: finalSteps,
                youtube: document.getElementById('recipeYoutube').value.trim(),
                createdAt: Date.now()
            };

            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.add(newRecipe);

            request.onsuccess = () => {
                closeAddModal();
                showToast("¡Receta guardada!", "success");
                loadRecipes();
            };
            request.onerror = () => showToast("Error al guardar", "error");
        };

        window.openViewModal = (id) => {
            const recipe = currentRecipes.find(r => r.id === id);
            if (!recipe) return;
            activeRecipeId = id;

            document.getElementById('viewImage').src = recipe.thumbnail || PLACEHOLDER_IMG;
            document.getElementById('viewTitle').textContent = recipe.title;
            
            // Renderizar pasos respetando saltos de línea (ahora guardados con número)
            const stepsDiv = document.getElementById('viewSteps');
            stepsDiv.innerHTML = '';
            
            const stepsArray = recipe.steps.split('\n');
            stepsArray.forEach(stepText => {
                if(stepText.trim() === '') return;
                const p = document.createElement('p');
                p.className = 'bg-gray-50 dark:bg-gray-700/30 p-3 rounded-xl border border-gray-100 dark:border-gray-700';
                p.textContent = stepText;
                stepsDiv.appendChild(p);
            });
            
            const ytBtn = document.getElementById('viewYoutube');
            if (recipe.youtube) {
                ytBtn.href = recipe.youtube;
                ytBtn.classList.remove('hidden');
                ytBtn.classList.add('flex');
            } else {
                ytBtn.classList.add('hidden');
                ytBtn.classList.remove('flex');
            }

            const ingList = document.getElementById('viewIngredientsList');
            ingList.innerHTML = '';
            const ingArray = recipe.ingredients.split(',').map(i => i.trim()).filter(i => i);
            ingArray.forEach(ing => {
                const li = document.createElement('li');
                li.className = "flex items-start gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition cursor-pointer";
                li.innerHTML = `
                    <div class="mt-1 flex-shrink-0 w-5 h-5 rounded border-2 border-brand-300 dark:border-brand-500/50 flex items-center justify-center text-white transition-colors">
                        <i class="fa-solid fa-check text-xs opacity-0 transition-opacity"></i>
                    </div>
                    <span class="text-gray-700 dark:text-gray-300">${ing}</span>
                `;
                li.onclick = function() {
                    const box = this.querySelector('div');
                    const icon = this.querySelector('i');
                    const text = this.querySelector('span');
                    
                    if (box.classList.contains('bg-brand-500')) {
                        box.classList.remove('bg-brand-500', 'border-brand-500');
                        box.classList.add('border-brand-300', 'dark:border-brand-500/50');
                        icon.classList.add('opacity-0');
                        text.classList.remove('line-through', 'text-gray-400', 'dark:text-gray-500');
                    } else {
                        box.classList.add('bg-brand-500', 'border-brand-500');
                        box.classList.remove('border-brand-300', 'dark:border-brand-500/50');
                        icon.classList.remove('opacity-0');
                        text.classList.add('line-through', 'text-gray-400', 'dark:text-gray-500');
                    }
                };
                ingList.appendChild(li);
            });

            document.getElementById('viewModalOverlay').classList.remove('hidden');
            const sidebar = document.getElementById('ingredientsSidebar');
            sidebar.classList.add('translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        };

        window.closeViewModal = () => {
            document.getElementById('viewModalOverlay').classList.add('hidden');
            activeRecipeId = null;
        };

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('ingredientsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        // --- CERRAR AL HACER CLIC FUERA ---
        document.getElementById('addModalOverlay').addEventListener('click', (e) => {
            if(e.target === document.getElementById('addModalOverlay')) closeAddModal();
        });
        
        document.getElementById('viewModalOverlay').addEventListener('click', (e) => {
            if(e.target === document.getElementById('viewModalOverlay')) closeViewModal();
        });
        
        document.getElementById('confirmModalOverlay').addEventListener('click', (e) => {
            if(e.target === document.getElementById('confirmModalOverlay')) closeConfirmModal();
        });

        // --- LÓGICA DE CONFIRMACIÓN Y BORRADO ---
        function triggerConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            const btn = document.getElementById('confirmActionBtn');
            
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', () => {
                closeConfirmModal();
                onConfirm();
            });
            document.getElementById('confirmModalOverlay').classList.remove('hidden');
        }

        window.closeConfirmModal = () => document.getElementById('confirmModalOverlay').classList.add('hidden');

        window.deleteCurrentRecipe = () => {
            if (!activeRecipeId) return;
            triggerConfirm("Borrar Receta", "¿Estás seguro de que quieres eliminar esta receta de tu colección?", () => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.delete(activeRecipeId);
                
                transaction.oncomplete = () => {
                    showToast("Receta eliminada", "success");
                    closeViewModal();
                    loadRecipes();
                };
            });
        };

        window.promptDeleteAll = () => {
            if (currentRecipes.length === 0) {
                showToast("No hay recetas para borrar.", "info");
                return;
            }
            triggerConfirm("¡Cuidado!", "Estás a punto de borrar TODAS tus recetas. Esto no se puede deshacer.", () => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.clear();
                
                transaction.oncomplete = () => {
                    showToast("Todas las recetas eliminadas", "success");
                    loadRecipes();
                };
            });
        };

        window.exportRecipes = () => {
            if (currentRecipes.length === 0) {
                showToast("No hay recetas para exportar.", "info");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentRecipes, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "mis_recetas_local.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            showToast("Recetas exportadas", "success");
        };

        window.importRecipes = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) throw new Error("Formato inválido");
                    
                    showToast("Importando...", "info");
                    
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    
                    let count = 0;
                    imported.forEach(rec => {
                        if (rec.title && rec.ingredients && rec.steps) {
                            if (!rec.id) rec.id = (Date.now() + count).toString();
                            store.put(rec);
                            count++;
                        }
                    });
                    
                    transaction.oncomplete = () => {
                        showToast(`${count} recetas importadas`, "success");
                        loadRecipes();
                    };

                } catch (err) {
                    showToast("Error al leer el archivo JSON", "error");
                }
                document.getElementById('importFile').value = "";
            };
            reader.readAsText(file);
        };

        let toastTimeout;
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const iconEl = document.getElementById('toastIcon');
            
            msgEl.textContent = message;
            iconEl.className = '';
            if (type === 'success') iconEl.className = 'fa-solid fa-check-circle text-green-400';
            else if (type === 'error') iconEl.className = 'fa-solid fa-circle-exclamation text-red-400';
            else iconEl.className = 'fa-solid fa-info-circle text-blue-400';

            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAddModal();
                closeViewModal();
                closeConfirmModal();
            }
        });
    </script>
</body>
</html>
